data:
  input_dir: "data"
  frames_dir: "output/frames"
  sfm_dir: "output/sfm"
  reconstruction_dir: "output/reconstruction"
  splat_dir: "output/splat"

#frame_extract
frame_extract:
  target_frames: 300
  blur_keep_ratio: 0.8
  blur_chunk_count: 10
  blur_min_per_chunk: 3
  resize_long_side: 1600
  output_format: "jpg"
  jpg_quality: 95

#gaussian
gaussian_splatting:
  iteration: 30000
  learning_rate: 0.001